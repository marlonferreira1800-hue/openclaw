name: scratch-ios-rewind-demo
# Scratch proof for openclaw/openclaw#193817 on the fork only: real iOS app in a
# task-owned simulator against the loopback fixture Gateway, before/after the fix.
on:
  push:
    branches: [scratch/ios-rewind-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewind-ios-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewind-demo:
    name: ios-rewind-demo
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Prepare Apple Mermaid assets
        run: |
          set -euo pipefail
          node scripts/prepare-apple-mermaid.mjs


      - name: Install Watch Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Install XcodeGen / SwiftFormat / SwiftLint
        run: |
          set -euo pipefail
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/xcodegen" --version

      - name: Prove rewind composer preservation (before/after)
        env:
          BASELINE_SHA: 58255890ba9ed690fb682e7e250905ebe79fcb72
        run: /bin/bash scripts/test-ios-rewind-proof.sh "$BASELINE_SHA"

      - name: Upload rewind demo evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewind-ios-demo-evidence
          path: apps/ios/build/LifecycleTestResults
