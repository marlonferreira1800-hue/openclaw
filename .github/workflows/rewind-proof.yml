name: scratch-rewind-proof-openclawkit
on:
  push:
    branches:
      - scratch/openclawkit-rewind-proof
  workflow_dispatch:

jobs:
  head-green:
    name: rewind tests on PR head (expect PASS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d25b7a96575db53fa3eba6e049f6ab5732e94424
          fetch-depth: 0
      - name: Toolchain provenance
        run: |
          xcodebuild -version
          swift --version
          node --version
      - name: Setup pnpm (pinned by packageManager)
        run: |
          corepack enable 2>/dev/null || true
          corepack prepare --activate "pnpm@12.15.0" 2>/dev/null || npm install -g pnpm@12.15.0
          pnpm --version
      - name: Install gateway-protocol JS deps (SwiftPM build plugin needs esbuild)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter '@openclaw/gateway-protocol...' \
            --config.ignore-scripts=false \
            --config.engine-strict=false \
            --config.enable-pre-post-scripts=true \
            --config.side-effects-cache=true
      - name: Build tests (setup/compile errors fail here)
        run: |
          cd apps/shared/OpenClawKit
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/head-build.log"
      - name: Run the 3 rewind regression tests (exit code passes through)
        run: |
          cd apps/shared/OpenClawKit
          set +e
          swift test --skip-build --filter "rewind preserves" 2>&1 | tee "$RUNNER_TEMP/head-tests.log"
          ec=${PIPESTATUS[0]}
          echo "swift-test-exit=$ec" | tee "$RUNNER_TEMP/head-exit.txt"
          exit "$ec"
      - name: Verify exactly 3 rewind tests ran and passed
        run: |
          n=$(grep -c '✔.*rewind preserves' "$RUNNER_TEMP/head-tests.log" || true)
          echo "passing-rewind-tests=$n"
          [ "$n" -eq 3 ] || { echo "expected 3 passing rewind tests, saw $n"; exit 1; }
      - name: Upload head logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewind-proof-head-green
          path: |
            ${{ runner.temp }}/head-tests.log
            ${{ runner.temp }}/head-exit.txt
            ${{ runner.temp }}/head-build.log

  base-red:
    name: rewind tests on PR base + new tests (expect FAIL)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58255890ba9ed690fb682e7e250905ebe79fcb72
          fetch-depth: 0
      - name: Overlay the new regression tests onto the base tree
        run: |
          git fetch origin d25b7a96575db53fa3eba6e049f6ab5732e94424
          git checkout d25b7a96575db53fa3eba6e049f6ab5732e94424 -- apps/shared/OpenClawKit/Tests/OpenClawKitTests/ChatViewModelSessionActionTests.swift
          git status --short
      - name: Toolchain provenance
        run: |
          xcodebuild -version
          swift --version
          node --version
      - name: Setup pnpm (pinned by packageManager)
        run: |
          corepack enable 2>/dev/null || true
          corepack prepare --activate "pnpm@12.15.0" 2>/dev/null || npm install -g pnpm@12.15.0
          pnpm --version
      - name: Install gateway-protocol JS deps (SwiftPM build plugin needs esbuild)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter '@openclaw/gateway-protocol...' \
            --config.ignore-scripts=false \
            --config.engine-strict=false \
            --config.enable-pre-post-scripts=true \
            --config.side-effects-cache=true
      - name: Build tests (setup/compile errors fail here)
        run: |
          cd apps/shared/OpenClawKit
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/base-build.log"
      - name: Run the 3 rewind regression tests (expect nonzero; zero means the fix is not needed)
        run: |
          cd apps/shared/OpenClawKit
          set +e
          swift test --skip-build --filter "rewind preserves" 2>&1 | tee "$RUNNER_TEMP/base-tests.log"
          ec=${PIPESTATUS[0]}
          echo "swift-test-exit=$ec" | tee "$RUNNER_TEMP/base-exit.txt"
          if [ "$ec" -eq 0 ]; then
            echo "UNEXPECTED: regression tests passed on base tree"
            exit 1
          fi
          exit 0
      - name: Verify exactly 3 rewind tests ran and failed
        run: |
          n=$(grep -c '✘.*rewind preserves' "$RUNNER_TEMP/base-tests.log" || true)
          echo "failing-rewind-tests=$n"
          [ "$n" -eq 3 ] || { echo "expected 3 failing rewind tests, saw $n"; exit 1; }
      - name: Upload base logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewind-proof-base-red
          path: |
            ${{ runner.temp }}/base-tests.log
            ${{ runner.temp }}/base-exit.txt
            ${{ runner.temp }}/base-build.log
